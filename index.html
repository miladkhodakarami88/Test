<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فروشگاه خسروی</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
      text-align: center;
    }
    .box {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      max-width: 360px;
      width: 90%;
    }
    .btn {
      display: block;
      background: #2563eb;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 15px;
      font-size: 15px;
    }
    .ios-box {
      display: none;
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-top: 15px;
      line-height: 1.6;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3 style="margin:0 0 10px;">فروشگاه خسروی</h3>
    <p style="font-size: 14px; color: #64748b; margin: 0 0 15px;">در صورت عدم اتصال، لطفاً فیلترشکن را خاموش کنید.</p>
    
    <a id="directLink" href="https://khosravi-group.com/" class="btn">ورود به صفحه محصول</a>

    <div id="iosTip" class="ios-box">
      👆 <b>کاربران آیفون:</b><br>
      علامت <b>۳ نقطه (...)</b> بالای صفحه را لمس کنید و گزینه <b>Open in Safari</b> (یا باز کردن در مرورگر) را انتخاب کنید.
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let target = urlParams.get('target') || 'https://khosravi-group.com/';
    
    // تصحیح لینک دکمه
    document.getElementById('directLink').href = target;

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(ua);
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

    if (isAndroid) {
      // حذف https:// یا http:// برای intent کروم
      const cleanTarget = target.replace(/^https?:\/\//i, '');
      window.location.href = "intent://" + cleanTarget + "#Intent;scheme=https;package=com.android.chrome;end";
    } else if (isIOS) {
      document.getElementById('iosTip').style.display = 'block';
    }
  </script>
</body>
</html>
